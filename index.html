      function adicionarDiasUteis(data, dias) {
        let resultado = new Date(data);
        let adicionados = 0;

        while (adicionados < dias) {
          resultado.setDate(resultado.getDate() + 1);

          const dia = resultado.getDay();

          if (dia !== 0 && dia !== 6) {
            adicionados++;
          }
        }

        return resultado;

      function diasUteisRestantes(dataFinal) {
        let hoje = new Date();
        let final = new Date(dataFinal);
        let dias = 0;

        while (hoje < final) {
          hoje.setDate(hoje.getDate() + 1);

          const dia = hoje.getDay();

          if (dia !== 0 && dia !== 6) {
            dias++;
          }
        }

        const [editando, setEditando] = useState(null);
        const [saving, setSaving] = useState(false);

        useEffect(() => {
          const init = async () => {
            try {
              const ps = await fbLoad();
              setPeds(ps);
            } catch (e) {
              console.error(e);
            }
            try {
              const s = localStorage.getItem('rbe-session');
              if (s) setSession(JSON.parse(s));
            } catch {}
            setLoad(false);
          };
          if (window._firebaseReady) init();
          else window.addEventListener('firebaseReady', init, { once: true });
        }, []);

        const isAdmin = session?.role === 'admin';

        const login = (s) => {
          setSession(s);
          try {
            localStorage.setItem('rbe-session', JSON.stringify(s));
          } catch {}
        };
        const logout = () => {

          try {
            localStorage.removeItem('rbe-session');
          } catch {}
        };

          setSaving(true);
          try {
            const saved = await fbSave(p);
            setPeds((prev) => {
              const ex = prev.find((x) => x.id === p.id);
              return ex
                ? prev.map((x) => (x.id === p.id ? saved : x))
                : [...prev, saved];
            });
            setModalNovo(false);

                        .filter((p) => p.stPgto === s.l)
                        .reduce((a, p) => a + (p.valor - (p.desc || 0)), 0);
                      const q = peds.filter((p) => p.stPgto === s.l).length;
                      return React.createElement(
                        'div',
                        {
                          key: s.l,
                          style: {
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                            padding: '10px 12px',
                            marginBottom: 8,
                            background: s.bg,
                            borderRadius: 8,
                            border: '1px solid ' + s.c + '33',
                          },
                        },
                        React.createElement(
                          'span',
                          {
                            style: {
                              fontSize: 13,
                              fontWeight: 600,
                              color: s.c,
                            },
                          },
                          s.i + ' ' + s.l
                        ),
                        React.createElement(
                          'div',
                          { style: { textAlign: 'right' } },
                          React.createElement(
                            'div',
                            {
                              style: {
                                fontSize: 15,
                                fontWeight: 700,
                                color: s.c,
                              },
                            },
                            moeda(tot)
                          ),
                          React.createElement(
                            'div',
                            { style: { fontSize: 11, color: C.g600 } },
                            q + ' pedido(s)'
                          )
                        )
                      );
                    })
                  )
              ),
            aba === 'faturamento' &&
              isAdmin &&
              React.createElement(Faturamento, { peds })
          ),
          (modalNovo || editando) &&
            React.createElement(FormPed, {
              ini: editando,
              onSave: salvar,
              onCancel: () => {
                setModalNovo(false);
                setEditando(null);
              },
              user: session,
              saving,
            })
        );
      }

      function Faturamento({ peds }) {
        const ano = new Date().getFullYear();
        const [anoSel, setAnoSel] = useState(String(ano));
        const anos = [
          ...new Set(
            peds
              .map((p) => (p.dataPed ? p.dataPed.slice(0, 4) : null))
              .filter(Boolean)
          ),
        ]
          .sort()
          .reverse();
        if (!anos.includes(String(ano))) anos.unshift(String(ano));
        const dados = MESES.map((nome, i) => {
          const mes = String(i + 1).padStart(2, '0');
          const chave = anoSel + '-' + mes;
          const pm = peds.filter(
            (p) => p.dataPed && p.dataPed.startsWith(chave)
          );
          const pagos = pm
            .filter((p) => p.stPgto === 'Pago')
            .reduce((s, p) => s + (p.valor - (p.desc || 0)), 0);
          const pend = pm
            .filter((p) => p.stPgto === 'Pendente')
            .reduce((s, p) => s + (p.valor - (p.desc || 0)), 0);
          return { nome, pagos, pend, total: pagos + pend, q: pm.length };
        });
        const totalAno = dados.reduce((s, d) => s + d.pagos, 0);
        const totalPedidos = peds.length;
        const totalPendente = dados.reduce((s, d) => s + d.pend, 0);
        const rankingServicos = {};

        const topServicos = Object.entries(rankingServicos)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
        const rankingOps = {};

        peds.forEach((p) => {
          if (p.stPgto !== 'Pago') return;

          const op = p.operador || 'Sem operador';

          rankingOps[op] = (rankingOps[op] || 0) + Number(p.valor || 0);
        });

        const topOps = Object.entries(rankingOps).sort((a, b) => b[1] - a[1]);
        const metaMensal = 5000;

        const faturadoMesAtual = dados[new Date().getMonth()]?.pagos || 0;

        const percentualMeta = (faturadoMesAtual / metaMensal) * 100;

        const ticketMedio = totalPedidos > 0 ? totalAno / totalPedidos : 0;

        peds.forEach((p) => {
          if (p.stPgto !== 'Pago') return;

          const valor = Number(p.valorFinal || p.valor || 0);

          if (!p.data) return;

          const partes = p.data.split('/');

          const mes = Number(partes[1]) - 1;

          if (mes >= 0) {
            faturamentoMensal[mes] += valor;
            dados.map((d) =>
              React.createElement(
                'div',
                {
                  style: {
                    display: 'flex',
                    justifyContent: 'space-between',
                    padding: '12px 0',
                    borderBottom: '1px solid #E9ECEF',
                    fontSize: 15,
                  },
                },

                React.createElement('strong', {}, d.nome),

                React.createElement(
                  'span',
                  {
                    style: {
                      color: '#0F2445',
                      fontWeight: 700,
                    },
                  },
                  moeda(d.pagos)
                )
              )
            );
          }
        });
        const maxMes = Math.max(...dados.map((d) => d.total), 1);
        return React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
          React.createElement(
            'div',
            {
              style: {
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))',
                gap: 14,
              },
            },
            React.createElement(Kpi, {
              label: 'Faturado ' + anoSel,
              valor: moeda(totalAno),
              icon: '💰',
              cor: C.green,
            }),
            React.createElement(Kpi, {
              label: 'Pedidos no Ano',
              valor: dados.reduce((s, d) => s + d.q, 0),
              icon: '📦',
              cor: C.navy,
            })
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', gap: 6 } },
            anos.map((a) =>
              React.createElement(
                'button',
                {
                  key: a,
                  onClick: () => setAnoSel(a),
                  style: {
                    padding: '6px 16px',
                    borderRadius: 20,
                    border: '1.5px solid ' + (anoSel === a ? C.navy : C.g200),
                    background: anoSel === a ? C.navy : C.white,
                    color: anoSel === a ? C.white : C.g600,
                    fontWeight: 600,
                    fontSize: 13,
                    cursor: 'pointer',
                    fontFamily: 'inherit',
                  },
                },
                a
              )
            )
          ),
          React.createElement(
            'div',
            {
              style: {
                background: C.white,
                borderRadius: 14,
                padding: 24,
                border: '1px solid ' + C.g200,
              },
            },
            React.createElement(
              'div',
              {
                style: {
                  fontFamily: 'Georgia,serif',
                  fontWeight: 700,
                  fontSize: 16,
                  color: C.navy,
                  marginBottom: 20,
                },
              },
              '📊 Faturamento — ' + anoSel
              
            ),
            React.createElement(
              'div',
              {
                style: {
                  display: 'flex',
                  alignItems: 'flex-end',
                  gap: 6,
                  height: 160,
                  marginBottom: 8,
                },
              },
              dados.map((d, i) => {
                const hP = maxMes > 0 ? (d.pagos / maxMes) * 140 : 0;
                const hPe = maxMes > 0 ? (d.pend / maxMes) * 140 : 0;
                const isA =
                  i === new Date().getMonth() && anoSel === String(ano);
                return React.createElement(
                  'div',
                  {
                    key: i,
                    style: {
                      flex: 1,
                      display: 'flex',
                      flexDirection: 'column',
                      alignItems: 'center',
                      gap: 2,
                    },
                  },
                  React.createElement(
                    'div',
                    {
                      style: {
                        width: '100%',
                        display: 'flex',
                        flexDirection: 'column',
                        justifyContent: 'flex-end',
                        height: 140,
                      },
                    },
                    d.pend > 0 &&
                      React.createElement('div', {
                        style: {
                          width: '100%',
                          height: hPe,
                          background: C.yellowL,
                          borderRadius: '3px 3px 0 0',
                        },
                      }),
                    d.pagos > 0 &&
                      React.createElement('div', {
                        style: {
                          width: '100%',
                          height: hP,
                          background: isA ? C.gold : C.navy,
                          borderRadius: d.pend > 0 ? '0' : '3px 3px 0 0',
                        },
                      }),
                    d.total === 0 &&
                      React.createElement('div', {
                        style: {
                          width: '100%',
                          height: 4,
                          background: C.g200,
                          borderRadius: 3,
                        },
                      })
                  ),
                  React.createElement(
                    'span',
                    {
                      style: {
                        fontSize: 10,
                        color: isA ? C.navy : C.g400,
                        fontWeight: isA ? 700 : 400,
                      },
                    },
                    d.nome
                  )
                );
              })
            )
          )
        );
      }
      

      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(App)
      );
    </script>
  </body>
